<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>昌都文旅宣传口号 · 网络投票</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#fff;color:#1f2937;font-family:-apple-system,"Microsoft YaHei",sans-serif}
  .box{text-align:center;padding:32px 24px;max-width:520px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#6b7280;font-size:15px;line-height:1.8;margin:8px 0}
  a.btn{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:999px;
        background:#1f3a5f;color:#fff;text-decoration:none;font-size:16px}
  .tiny{color:#9ca3af;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="box">
  <h1>昌都文旅宣传口号 · 网络投票</h1>
  <p id="hint">正在带你去投票页面…</p>
  <a class="btn" id="go" href="https://suppose-pathology-implied-groove.trycloudflare.com">进入投票页</a>
  <p class="tiny">如果没有自动跳转，请点上面的按钮。</p>
</div>
<script>
var FALLBACK = "https://suppose-pathology-implied-groove.trycloudflare.com";
function go(u){ try { location.replace(u); } catch(e) {} }
(function(){
  var done = false;
  function jump(u){ if (done) return; done = true; go(u); }
  setTimeout(function(){ jump(FALLBACK); }, 2500);
  fetch("current.json?ts=" + Date.now(), {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(j){ jump(j["vote"] || FALLBACK); })
    .catch(function(){ jump(FALLBACK); });
})();
</script>
</body>
</html>
